name: Parity Matrix

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: phpunit

      - name: Run policy parity tests
        run: phpunit -c phpunit.parity.xml
